name: Python CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build-test:
    uses: ./.github/workflows/build-test.yml

  deploy-dev:
  needs: build-test

  uses: ./.github/workflows/deploy.yml

  with:
    environment: dev
  
  deploy-qa:
  needs: deploy-dev

  uses: ./.github/workflows/deploy.yml

  with:
    environment: qa